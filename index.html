<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Biology Quiz App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 20px;
        }
        .header {
            background-color: #0b8a54;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .header .home-btn {
            background: #08693f;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .content-body {
            padding: 20px;
        }
        .quiz-info {
            display: flex;
            justify-content: space-between;
            color: #555;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .question-text {
            font-size: 1.2rem;
            color: #222;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .option-item {
            background: #fff;
            border: 2px solid #d1e7dd;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: #333;
        }
        .option-item:hover {
            background-color: #f1f8f5;
            border-color: #0b8a54;
        }
        .option-item.selected {
            background-color: #d1e7dd;
            border-color: #0b8a54;
            font-weight: bold;
        }
        .explanation-box {
            background: #f9f9f9;
            border-left: 4px solid #0b8a54;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            color: #444;
            display: none;
        }
        .analysis-btn-container {
            text-align: center;
        }
        .analysis-btn {
            background-color: #0b8a54;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .analysis-btn:hover {
            background-color: #08693f;
        }
        .hidden {
            display: none;
        }
        .results-card {
            text-align: center;
            padding: 20px;
        }
        .results-card h2 {
            color: #0b8a54;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <span id="header-title">ජීවයේ ලක්ෂණ</span>
            <button class="home-btn" onclick="resetQuiz()">Home</button>
        </div>

        <!-- Quiz Container -->
        <div class="content-body" id="quiz-screen">
            <div class="quiz-info">
                <span id="subtopic-label">උපමානකාව</span>
                <span id="question-counter">ප්‍රශ්නය 1/3</span>
            </div>
            
            <div class="question-text" id="question-text">
                ප්‍රශ්නය මෙහි පෙන්වනු ලැබේ...
            </div>

            <ul class="options-list" id="options-list">
                <!-- Options will load dynamically -->
            </ul>

            <div class="explanation-box" id="explanation-box">
                <strong>විවරණය (Resource Book):</strong> <span id="explanation-text"></span>
            </div>
        </div>

        <!-- Results Screen (Initially Hidden) -->
        <div class="content-body hidden" id="results-screen">
            <div class="results-card">
                <h2>ප්‍රතිඵල විශ්ලේෂණය (Performance Analysis)</h2>
                <p id="score-summary" style="font-size: 1.2rem; margin: 20px 0;"></p>
                <button class="analysis-btn" onclick="resetQuiz()">다시 시작 (Restart Quiz)</button>
            </div>
        </div>

        <!-- Footer Action Button -->
        <div class="content-body" id="footer-action">
            <div class="analysis-btn-container">
                <button class="analysis-btn" id="main-action-btn" onclick="handleNextOrAnalysis()">ඊළඟ (Next)</button>
            </div>
        </div>
    </div>

    <script>
        // Sample Quiz Data (Matches your A/L Biology context)
        const quizData = [
            {
                subtopic: "ජීවයේ ලක්ෂණ",
                question: "1. සජීවී පද්ධතිවල පවතින මූලික ලක්ෂණයක් වන්නේ කුමක්ද?",
                options: [
                    "පරිවෘත්තීය ක්‍රියාව සිදු වීම",
                    "ස්ථාවරව පැවතීම පමණක් වීම",
                    "බාහිර සාධක මත පමණක් රඳා පැවතීම",
                    "අජීවී ස්වභාවය පෙන්වීම",
                    "කිසිදු බලපෑමකට ලක් නොවීම"
                ],
                correct: 0,
                explanation: "සජීවී පද්ධතිවල රසායනික ප්‍රතික්‍රියා සමුදායක් වන පරිවෘත්තීය ක්‍රියාවලිය මූලික ලක්ෂණයකි."
            },
            {
                subtopic: "ජීවයේ ලක්ෂණ",
                question: "2. හෝමියෝස්ටැසිස් (Homeostasis) යනු කුමක්ද?",
                options: [
                    "ශරීරයේ බර වැඩි වීම",
                    "බාහිර පරිසරය වෙනස් වන විට අභ්‍යන්තර පරිසරය නියතව පවත්වා ගැනීම",
                    "ශක්තිය සම්පූර්ණයෙන්ම ක්ෂය වීම",
                    "සෛල බෙදීම නතර වීම",
                    "ප්‍රජනනය සිදු නොවීම"
                ],
                correct: 1,
                explanation: "හෝමියෝස්ටැසිස් යනු බාහිර පරිසරයේ වෙනස්වීම් හමුවේ ජීවී අභ්‍යන්තර පරිසරය ප්‍රශස්ත ලෙස නියතව පවත්වා ගැනීමයි."
            },
            {
                subtopic: "ජීවයේ ලක්ෂණ",
                question: "3. ජීවියෙකුට බාහිර හෝ අභ්‍යන්තර උත්තේජනයකට ප්‍රතිචාර දැක්වීමට ඇති හැකියාව හැඳින්වෙන්නේ කුමක්ද?",
                options: [
                    "උත්චේජ්‍යතාව (Irritability)",
                    "හෝමියෝස්ටැසිස්",
                    "පරිවෘත්තීය",
                    "අනුකූලනය",
                    "විභේදනනය"
                ],
                correct: 0,
                explanation: "උත්චේජ්‍යතාව යනු පරිසරයේ සිදුවන වෙනස්වීම් (උත්තේජන) හඳුනාගෙන ورට ප්‍රතිචාර දැක්වීමේ හැකියාවයි."
            }
        ];

        let currentQuestion = 0;
        let selectedOption = null;
        let score = 0;
        let isAnswered = false;

        const questionCounterEl = document.getElementById("question-counter");
        const questionTextEl = document.getElementById("question-text");
        const optionsListEl = document.getElementById("options-list");
        const explanationBoxEl = document.getElementById("explanation-box");
        const explanationTextEl = document.getElementById("explanation-text");
        const mainActionBtn = document.getElementById("main-action-btn");
        const quizScreen = document.getElementById("quiz-screen");
        const resultsScreen = document.getElementById("results-screen");
        const footerAction = document.getElementById("footer-action");

        function loadQuestion() {
            isAnswered = false;
            selectedOption = null;
            explanationBoxEl.style.display = "none";
            
            const q = quizData[currentQuestion];
            questionCounterEl.innerText = `ප්‍රශ්නය ${currentQuestion + 1}/${quizData.length}`;
            questionTextEl.innerText = q.question;
            
            optionsListEl.innerHTML = "";
            q.options.forEach((opt, index) => {
                const li = document.createElement("li");
                li.className = "option-item";
                li.innerText = `(${index + 1}) ${opt}`;
                li.onclick = () => selectOption(index, li);
                optionsListEl.appendChild(li);
            });

            if (currentQuestion === quizData.length - 1) {
                mainActionBtn.innerText = "ප්‍රතිඵල විශ්ලේෂණය (Performance Analysis)";
            } else {
                mainActionBtn.innerText = "ඊළඟ (Next)";
            }
        }

        function selectOption(index, element) {
            if (isAnswered) return;
            
            // Remove selection from others
            document.querySelectorAll(".option-item").forEach(el => el.classList.remove("selected"));
            element.classList.add("selected");
            
            selectedOption = index;
            isAnswered = true;

            const q = quizData[currentQuestion];
            if (selectedOption === q.correct) {
                score++;
            }

            // Show explanation box like in your screenshot
            explanationTextEl.innerText = q.explanation;
            explanationBoxEl.style.display = "block";
        }

        function handleNextOrAnalysis() {
            if (!isAnswered && currentQuestion < quizData.length) {
                alert("කරුණාකර පිළිතුරක් තෝරන්න!");
                return;
            }

            currentQuestion++;

            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showAnalysis();
            }
        }

        function showAnalysis() {
            quizScreen.classList.add("hidden");
            resultsScreen.classList.remove("hidden");
            footerAction.classList.add("hidden"); // Hide regular next button

            document.getElementById("score-summary").innerText = 
                `ඔබ ලබාගත් ලකුණු: ${score} / ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            quizScreen.classList.remove("hidden");
            resultsScreen.classList.add("hidden");
            footerAction.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize first question on load
        loadQuestion();
    </script>
</body>
</html>
